name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check qforecast tests benchmarks
      - name: Test
        run: pytest -q
      - name: Feature benchmark (smoke)
        run: python benchmarks/bench_features.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build -f deploy/Dockerfile -t qforecast:ci .
