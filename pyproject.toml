[project]
name = "qforecast"
version = "0.1.0"
description = "Daily cross-sectional crypto trading simulator and research toolkit (C5 strategy, adaptive signal weights, paper bot); plus the original low-latency forecasting pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
qf-ingestor = "qforecast.services.ingestor:main"
qf-signal = "qforecast.services.signal:main"
qf-analytics = "qforecast.services.analytics:main"
qf-gateway = "qforecast.services.gateway:main"
qf-recorder = "qforecast.services.recorder:main"
qf-train = "qforecast.trainer.train:main"
qf-paper = "qforecast.services.paper:main"
qf-sim = "qforecast.sim.backtest:main"
qf-cube = "qforecast.swing.data:main"
qf-backtest = "qforecast.swing.backtest:main"
qf-paper-c5 = "qforecast.swing.paper:main"
qf-dashboard = "qforecast.swing.dashboard:main"
qf-adaptive = "qforecast.adaptive.weights:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qforecast*"]

[tool.setuptools.package-data]
qforecast = ["services/static/*.html", "swing/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]
